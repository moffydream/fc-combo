name: 수집 및 배포

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  FC_DB: state/fc_combo.db

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: 이전 DB 복원
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 수집
        env:
          NEXON_API_KEYS: ${{ secrets.NEXON_API_KEYS }}
        run: |
          mkdir -p state
          python collector.py --batch \
            --seed-if-empty --seed ${{ vars.SEED_NICKNAMES }} \
            --run-minutes ${{ vars.RUN_MINUTES || 25 }} \
            --max-matches ${{ vars.MATCHES_PER_RUN || 1000 }} \
            --window-days ${{ vars.WINDOW_DAYS || 7 }} \
            --users 30 --rps 50 --daily 5000000

      - name: DB 저장
        if: always() && hashFiles('state/fc_combo.db') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 사이트 빌드
        run: python build_site.py --out site --min-games ${{ vars.MIN_GAMES || 20 }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 예약 실행 유지
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "예약 실행 유지"
            git push
          fi
